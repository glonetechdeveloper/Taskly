<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taskly — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="page-shell">
  <div class="auth-layout">

    <!-- Left brand panel -->
    <aside class="brand-panel">
      <div class="brand-block">
        <div class="brand-mark">
          <img class="brand-mark-icon" src="assets/tasklylogo.png" alt="Taskly logo">
          
        </div>
        <p class="brand-tagline">From task to done</p>
      </div>
    </aside>

    <!-- Right form panel (white) -->
    <main class="form-panel">

      <!-- Minimal slanted productivity-icon wallpaper, yellow, on the white panel -->
      <div class="bg-pattern" id="bgPattern" aria-hidden="true">
        <svg class="pattern-root" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <symbol id="ic-notebook" viewBox="0 0 40 40">
              <rect x="7" y="4" width="24" height="32" rx="3"/>
              <circle cx="11" cy="4.5" r="1.1" fill="currentColor" stroke="none"/>
              <circle cx="17" cy="4.5" r="1.1" fill="currentColor" stroke="none"/>
              <circle cx="23" cy="4.5" r="1.1" fill="currentColor" stroke="none"/>
              <line x1="12" y1="15" x2="26" y2="15"/>
              <line x1="12" y1="21" x2="26" y2="21"/>
              <line x1="12" y1="27" x2="22" y2="27"/>
            </symbol>
            <symbol id="ic-calculator" viewBox="0 0 40 40">
              <rect x="7" y="4" width="26" height="32" rx="4"/>
              <rect x="11" y="9" width="18" height="7" rx="1.5"/>
              <circle cx="13" cy="22" r="1.4" fill="currentColor" stroke="none"/>
              <circle cx="20" cy="22" r="1.4" fill="currentColor" stroke="none"/>
              <circle cx="27" cy="22" r="1.4" fill="currentColor" stroke="none"/>
              <circle cx="13" cy="29" r="1.4" fill="currentColor" stroke="none"/>
              <circle cx="20" cy="29" r="1.4" fill="currentColor" stroke="none"/>
              <circle cx="27" cy="29" r="1.4" fill="currentColor" stroke="none"/>
            </symbol>
            <symbol id="ic-pencil" viewBox="0 0 40 40">
              <path d="M7 33 L27 13"/>
              <path d="M27 13 L31 9 L34 12 L30 16 Z"/>
              <path d="M7 33 L5 36 L9 34 Z" fill="currentColor" stroke="none"/>
            </symbol>
            <symbol id="ic-clock" viewBox="0 0 40 40">
              <circle cx="20" cy="20" r="15"/>
              <line x1="20" y1="20" x2="20" y2="10"/>
              <line x1="20" y1="20" x2="27" y2="23"/>
            </symbol>
            <symbol id="ic-check" viewBox="0 0 40 40">
              <rect x="6" y="6" width="28" height="28" rx="7"/>
              <path d="M13 20 L18 25 L28 13"/>
            </symbol>
            <symbol id="ic-cup" viewBox="0 0 40 40">
              <path d="M9 13 H26 V25 A8.5 8.5 0 0 1 9 25 Z"/>
              <path d="M26 16 A5.5 5.5 0 0 1 26 27"/>
              <line x1="12" y1="8" x2="12" y2="11"/>
              <line x1="17.5" y1="6" x2="17.5" y2="9.5"/>
            </symbol>
            <pattern id="taskly-pattern" width="260" height="260" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
              <use class="pat-icon" href="#ic-notebook" x="6" y="14" width="34" height="34"/>
              <use class="pat-icon" href="#ic-calculator" x="150" y="46" width="30" height="30"/>
              <use class="pat-icon" href="#ic-pencil" x="60" y="150" width="30" height="30"/>
              <use class="pat-icon" href="#ic-clock" x="196" y="176" width="28" height="28"/>
              <use class="pat-icon" href="#ic-check" x="16" y="206" width="24" height="24"/>
              <use class="pat-icon" href="#ic-cup" x="150" y="4" width="26" height="26"/>
              <use class="pat-icon" href="#ic-notebook" x="220" y="220" width="24" height="24"/>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#taskly-pattern)"/>
        </svg>
      </div>

      <div class="auth-card" id="authCard">

        <div class="mobile-brand">
          <img class="brand-mark-icon" src="assets/tasklylogo.png" alt="Taskly logo">
          
        </div>

        <div class="avatar-circle">
          <img class="mascot mascot-bob" src="assets/Nodi.png" alt="Nodi, the Taskly mascot">
        </div>

        <h2>Sign In</h2>
        <p class="sub">Turn your goals into clear, actionable steps today. Sign in to your account right away!</p>

        <div id="error-message" class="auth-alert" style="display:none; color: #e53e3e; background: #fff5f5; border: 1px solid #feb2b2; padding: 10px 14px; border-radius: 8px; font-size: 0.875rem; margin-bottom: 1rem; text-align: center;"></div>

        <form class="auth-form" id="formSignin" novalidate>

          <div class="field" id="fieldEmail">
            <label for="email">Email</label>
            <div class="field-input-wrap has-suffix">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 6 10 7L22 6"/></svg>
              <input type="email" id="email" name="email" placeholder="Enter email here" autocomplete="email" required>
            </div>
            <div class="field-error"><span>&#9888;</span><span class="field-error-text">Enter a valid email address</span></div>
          </div>

          <div class="field" id="fieldPassword">
            <label for="password">Password</label>
            <div class="field-input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input type="password" id="password" name="password" placeholder="Enter password here" autocomplete="current-password" required>
              <button type="button" class="field-toggle-visibility" data-target="password" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="field-error"><span>&#9888;</span><span class="field-error-text">Enter your password</span></div>
          </div>

          <button type="submit" class="btn-primary">
            <span class="btn-label">Sign In</span>
            <span class="btn-spinner"><span class="spinner-ring"></span></span>
          </button>

          <p class="switch-line">Don't have an account? <a href="signup.html">Sign Up</a></p>
        </form>

      </div>
    </main>

  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>Taskly.initForm({ mode: 'login' });</script>
</body>
</html>
